<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
               script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://www.googletagmanager.com; 
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
               font-src https://fonts.gstatic.com; 
               img-src 'self' data: https://*.googleapis.com https://*.gstatic.com https://www.googletagmanager.com; 
               connect-src 'self' https://generativelanguage.googleapis.com https://www.google-analytics.com https://analytics.google.com; 
               frame-src https://www.google.com https://maps.google.com https://www.google.com/maps;" />

  <!-- SEO -->
  <title>ElectIQ — India's Smartest Election Education Assistant</title>
  <meta name="description" content="Learn the Indian election process interactively — voter registration, EVM, timelines, and more. Powered by Google Gemini AI." />
  <meta name="keywords" content="india elections, voter education, EVM, election process, voter registration, ECI" />
  <meta name="author" content="ElectIQ Team" />
  <meta name="theme-color" content="#FF6B35" />

  <!-- Open Graph -->
  <meta property="og:title" content="ElectIQ — Know Your Vote. Own Your Voice." />
  <meta property="og:description" content="Interactive election education assistant for Indian voters. Powered by Google Gemini AI." />
  <meta property="og:type" content="website" />

  <!-- Structured Data — JSON-LD for Google Rich Results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ElectIQ",
    "description": "India's smartest AI-powered election education assistant. Learn voter registration, EVM, timelines, and Indian democracy interactively.",
    "url": "https://electiq.app",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
    "author": { "@type": "Organization", "name": "ElectIQ Team" },
    "inLanguage": ["en", "hi"],
    "audience": { "@type": "Audience", "audienceType": "Indian Voters" },
    "keywords": "Indian elections, voter education, EVM, election process, voter registration, ECI, democracy",
    "isAccessibleForFree": true
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "How do I register to vote in India?",
        "acceptedAnswer": { "@type": "Answer", "text": "Fill Form 6 online at NVSP (voters.eci.gov.in) or visit your nearest ERO office. You need age proof, address proof, and a passport-size photo." }
      },
      {
        "@type": "Question",
        "name": "What is an EVM (Electronic Voting Machine)?",
        "acceptedAnswer": { "@type": "Answer", "text": "EVMs are standalone electronic devices used for casting votes in India. They have no wireless connectivity and run on batteries, making them usable in remote areas." }
      },
      {
        "@type": "Question",
        "name": "What is NOTA in Indian elections?",
        "acceptedAnswer": { "@type": "Answer", "text": "NOTA (None of the Above) is an option on every EVM that allows voters to reject all candidates. However, it currently has no legal consequence on election results." }
      }
    ]
  }
  </script>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>" />

  <!-- Theme bootstrap — runs synchronously before paint to avoid FOUC.
       Must mirror the small subset of theme.js that decides effective theme. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem('electiq-theme');
        var stored = (v === 'light' || v === 'dark' || v === 'system') ? v : 'system';
        var effective = stored;
        if (stored === 'system') {
          effective = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', effective);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', effective === 'light' ? '#FFFFFF' : '#0A0A14');
      } catch (e) { /* localStorage unavailable */ }
    })();
  </script>

  <!-- Critical CSS — inlined to avoid render-blocking + FOUC for the first viewport.
       Kept tiny: only design tokens, body/header skeleton, and the loading shell. -->
  <style>
    :root {
      --color-primary: #FF6B35;
      --bg-base: #0A0A14;
      --text-primary: #F1F1F4;
      --text-muted: #6B6B82;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    }
    [data-theme="light"] { --bg-base: #F7F7FB; --text-primary: #0F0F1A; --text-muted: #6B6B82; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body); line-height: 1.7;
      color: var(--text-primary); background: var(--bg-base);
      min-height: 100vh; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .skip-link {
      position: fixed; top: -100%; left: 1rem; padding: 0.75rem 1.5rem;
      background: var(--color-primary); color: #0A0A14;
      font-weight: 600; border-radius: 0 0 10px 10px; z-index: 400;
      text-decoration: none; transition: top 150ms;
    }
    .skip-link:focus { top: 0; outline: 3px solid #3B82F6; outline-offset: 2px; }
    .app-loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; gap: 1rem; color: var(--text-muted);
    }
    .app-loading-spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,107,53,0.2);
      border-top-color: var(--color-primary); border-radius: 50%;
      animation: app-spin 0.8s linear infinite;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .app-loading-spinner { animation: none; } }
  </style>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Google Charts -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <!-- Google Analytics 4 — loaded conditionally via env -->
  <script>
    window.__GA_ID__ = '';
  </script>

  <!-- Styles — served from public/ so browser receives real CSS, not Vite JS modules.
       Loaded async via media trick to remove render-blocking.  -->
  <link rel="stylesheet" href="/app.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/app.css" /></noscript>
</head>
<body>
  <!-- Skip Navigation (Accessibility) -->
  <a href="#main-content" class="skip-link" id="skip-nav">Skip to main content</a>

  <!-- Header -->
  <header id="app-header" role="banner"></header>

  <!-- Main Content -->
  <main id="main-content" role="main" tabindex="-1">
    <!-- Hero Section -->
    <section id="hero" class="hero-section" aria-labelledby="hero-title"></section>

    <!-- Feature Grid (Dashboard Style) -->
    <section id="feature-grid" class="section reveal" style="padding-top: 0;"></section>

    <!-- Election Day Countdown -->
    <section id="countdown" aria-label="Next election milestone countdown"></section>

    <!-- Journey Map -->
    <section id="journey" class="section" aria-labelledby="journey-title"></section>

    <!-- Timeline -->
    <section id="timeline" class="section" aria-labelledby="timeline-title"></section>

    <!-- Voter Eligibility Quick-Checker -->
    <section id="eligibility" class="section" aria-labelledby="eligibility-title"></section>

    <!-- Polling Day Checklist -->
    <section id="checklist" class="section" aria-labelledby="checklist-title"></section>

    <!-- EVM Simulator -->
    <section id="evm" class="section" aria-labelledby="evm-title"></section>

    <!-- Quiz -->
    <section id="quiz" class="section" aria-labelledby="quiz-title"></section>

    <!-- Voter Pledge -->
    <section id="pledge" class="section" aria-labelledby="pledge-title"></section>

    <!-- Glossary -->
    <section id="glossary" class="section" aria-labelledby="glossary-title"></section>

    <!-- Maps -->
    <section id="maps" class="section" aria-labelledby="maps-title"></section>
  </main>

  <!-- Chatbot Widget -->
  <div id="chatbot-container" role="complementary" aria-label="AI Election Assistant"></div>

  <!-- Footer -->
  <footer id="app-footer" role="contentinfo">
    <div class="footer-inner">
      <p>ElectIQ © 2026 — Built with ❤️ using Google Antigravity</p>
      <p class="footer-disclaimer">Data sourced from the Election Commission of India (ECI). This is an educational tool and does not represent official ECI communication.</p>
    </div>
  </footer>

  <!-- App Entry -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
